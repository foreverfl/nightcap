name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # No cgo, so one Linux runner cross-builds all three binaries.
      - name: Build
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -ldflags "-X main.version=$GITHUB_REF_NAME" -o "dist/nightcap_${target%/*}_${target#*/}" .
          done

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
